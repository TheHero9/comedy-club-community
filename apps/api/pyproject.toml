[project]
name = "comedy-club-api"
version = "0.1.0"
description = "Django + Django-Ninja API for the podcast community platform"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "django-cors-headers>=4.6",
    "python-dotenv>=1.0",
    "redis>=5.2",
    "celery>=5.4",
    "django-celery-beat>=2.7",
    "yt-dlp>=2025.1.15",
    "requests>=2.32",
    "pillow>=11.0",
    "pyjwt[crypto]>=2.10",
    "meilisearch>=0.33",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "model-bakery>=1.20",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["podcast", "config"]
addopts = "-q --reuse-db"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "podcast"]
