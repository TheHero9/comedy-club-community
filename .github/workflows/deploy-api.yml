name: Deploy API

# 🚨 THE PROBLEM THIS SOLVES.
#
# A push to `main` deploys the WEB only. Vercel rebuilds on every push; Railway
# never has, because the Railway GitHub App is not installed on this repo, so
# its push trigger has simply never fired. That was believed to be working for
# days and only surfaced on 2026-08-15, when two commits touching `apps/api/**`
# produced ZERO Railway deployments - not queued, not failed, never created.
#
# That is the worst possible shape: the site looks deployed while serving an
# old schema. This closes it from the CI side, so "push to main" ships the
# whole app rather than half of it.
#
# 🚨 WHY THIS AND NOT THE RAILWAY GITHUB APP.
#
# Installing the app is one click and needs no token, and it was the obvious
# answer - but it deploys on the PUSH, with nothing in between. This repo has
# standing authorization to commit straight to `main` with no PR and no review,
# and the api service's preDeployCommand is `migrate --noinput`. Together those
# mean a typo in a model would run an unreviewed schema change against
# production Postgres seconds after being typed, and `makemigrations --check`
# would find out about it afterwards.
#
# Gating on CI is worth the one secret it costs. See
# specs/10-deployment/02-auto-deploy.md for the full comparison.
#
# 🚨 If the GitHub App is ever installed as well, DELETE this file - otherwise
# every push deploys twice and the two race each other.
#
# ⚠️ REQUIRES ONE SECRET: `RAILWAY_TOKEN`, a PROJECT token for
# comedy-club-community / production. Without it the job fails loudly rather
# than skipping - a deploy step that quietly no-ops would recreate the exact
# bug it exists to prevent.

on:
  # ✅ ARMED since 2026-08-16: `RAILWAY_TOKEN` is set, so a green CI run on
  # `main` now deploys the API automatically.
  #
  # Gated on CI via `workflow_run` rather than a bare `push`, because the api
  # service's preDeployCommand is `migrate --noinput` - a deploy IS a schema
  # change against production Postgres, and must not start until ruff,
  # migration-drift and pytest have passed on that exact commit.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never two deploys of the same service at once, and DO NOT cancel one in
  # flight: a half-applied migration is much worse than a queued deploy.
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Railway - api, celery-worker, celery-beat
    runs-on: ubuntu-latest
    # A red CI run must never reach production. `workflow_dispatch` has no
    # `workflow_run` payload, so that branch of the condition lets a manual run
    # through deliberately.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          # 🚨 The commit CI actually passed on, not whatever `main` points at
          # now. Without this, a push landing during the CI run would be
          # deployed on the strength of the previous commit's green tick.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Fail early and loudly with no token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set, so the API was NOT deployed."
            echo "Add it under Settings > Secrets and variables > Actions."
            echo "Create it in Railway: project comedy-club-community >"
            echo "Settings > Tokens > new PROJECT token for 'production'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g @railway/cli

      # 🚨 Stamp the commit INTO the image, so the running container can be
      # asked what it is. `railway up` uploads a source snapshot and carries no
      # git metadata, so Railway's own deployment list cannot answer "is the new
      # code live?" - and that question going unanswered for days is the whole
      # reason this workflow exists. `/api/health` returns this as `version`.
      #
      # BUILD_SHA is tracked (holding the placeholder "dev") rather than
      # generated, because a gitignored file would be excluded from the upload.
      - name: Stamp the build
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "$SHA" > apps/api/BUILD_SHA
          echo "Deploying ${SHA:0:7}"

      # 🚨 `railway up`, never `railway redeploy`. Redeploy re-runs the most
      # recent deployment REUSING that deployment's build and config, so it
      # ships the OLD commit - and any service-config change made since is
      # silently ignored. `up` creates a genuinely new deployment from the
      # checked-out source, which is this commit.
      #
      # 🚨 `api` FIRST, and not in parallel. It is the only service carrying
      # `preDeployCommand: migrate --noinput`, so the schema has to land before
      # the worker and beat start running task code against it. (Beat also
      # fires overdue jobs immediately on container start.)
      #
      # No `--detach`: we want the command to wait, so a failed build or a
      # failed migration fails this job instead of being reported as a
      # successful deploy that never served.
      # 🚨 Run `railway up` from the REPO ROOT, never from apps/api. The
      # services' `rootDirectory: /apps/api` is applied INSIDE the uploaded
      # archive, so uploading apps/api itself makes Railway look for
      # apps/api/apps/api and railpack's prepare step fails on an empty
      # directory (proven by deployment c565b019, 2026-08-16). The docs are
      # explicit: the archive root is the project root, and the service's
      # root-directory setting selects the subdirectory.
      - name: Deploy api (runs the migration)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service api --environment production --ci

      - name: Deploy celery-worker and celery-beat
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          # ⚠️ Both MUST be redeployed even when only the API "changed". They
          # bake the code into their own image with no source mount, so a
          # worker left on an old image runs old task code against a new
          # schema - which is how the nightly sync degraded 1,171 rows on
          # 2026-08-13.
          for service in celery-worker celery-beat; do
            echo "::group::$service"
            railway up --service "$service" --environment production --ci
            echo "::endgroup::"
          done

      # 🚨 The job does not pass until the deployed code ANSWERS. A built
      # container is not a serving one, and every incident in this project's
      # history is some version of "it reported success and served the old
      # thing". This asks the live API what commit it is running.
      - name: Verify the new code is actually serving
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          WANT="${SHA:0:7}"
          echo "Waiting for https://api.comedycommunity.club to report $WANT"

          for attempt in $(seq 1 40); do
            GOT=$(curl -fsS --max-time 10 https://api.comedycommunity.club/api/health \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' \
                  2>/dev/null || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "✅ serving $GOT"
              exit 0
            fi
            echo "  attempt $attempt: serving '${GOT:-unreachable}'"
            sleep 15
          done

          echo "::error::The API never reported $WANT. It built but is not serving."
          echo "Check the deploy logs for the 'migrate --noinput' output - a failed"
          echo "migration fails the release and Railway keeps the old container."
          exit 1
